# asr_provider = "voicestick_cloud"   # VoiceStick Cloud
# asr_provider = "volcengine"         # 火山引擎（默认）
# asr_provider = "tencent"            # 腾讯云 ASR（普方英大模型）
asr_provider = "volcengine"
voicestick_api_key = ""
voicestick_cloud_url = "wss://api.xiaozhi.me/voicestick/asr/"
volcengine_api_key = "your_volcengine_asr_api_key"
# 腾讯云 ASR 配置（仅在 asr_provider = "tencent" 时需要）
# tencent_secret_id = "AKID..."
# tencent_secret_key = "..."
# tencent_appid = "1234567890"
# tencent_engine_model_type = "16k_zh_en"   # 普方英大模型（普通话+粤语+英语+方言）
# tencent_hotword_id = ""                    # 可选，热词表 VocabId；为空时自动创建
llm_base_url = "https://api.openai.com/v1"
llm_api_key = "your_openai_compatible_llm_api_key"
llm_model = "gpt-5.5"
# ASR 文本精修：用 LLM 对识别原文去停顿空格 / 修标点 / 去口头语（best-effort，失败回退原文）。
refine_enabled = true
# refine_prompt = ""  # 留空使用内置默认精修 prompt
hotword_process_enabled = false
# hotword_process_prompt = ""  # 留空使用内置默认热词提炼 prompt（Windows-only）
interaction_mode = "hold_to_talk"
resource_id = "volc.seedasr.sauc.duration"
asr_hotwords = "小智,VoiceStick"
paired_device_ids = ""
device_theme_colors = ""
device_overlay_positions = ""
auto_enter = true
debug_audio_cache = false
# debug_audio_dir = "~/Library/Application Support/VoiceStick/DebugAudio"

# 体感鼠标（侧键单击进入）：角度控制——积分角速度得相对偏转角 θ，保持 θ 光标持续移动。
air_mouse_sensitivity_x = 5  # 左右灵敏度 1~10，映射 gain_x=sensitivity_x×320.0
air_mouse_sensitivity_y = 5  # 上下灵敏度 1~10，映射 gain_y=sensitivity_y×320.0
air_mouse_tau = 0.10         # 速度环时间常数（秒），越大惯性/缓停越长
air_mouse_invert_y = false   # 反转 Y 轴（适配用户习惯）

# MiniEncoderC 编码器旋转映射（仅 Windows 端消费，macOS 暂不支持）：
# encoder_to_arrow = true          # 旋转注入方向键开关（顺时针→Down、逆时针→Up）
# encoder_rotation_invert = false  # 旋转方向翻转（true 时顺时针→Up）

# 以下编码器设置项同样仅 Windows 端消费（macOS 暂不支持）：
# 编码器旋转顺时针/逆时针注入的按键（热键语法：单键 up/down/left/right/enter/tab/
# pageup/pagedown/volumeup/volumedown/f1-f24/单字符，或 ctrl/alt/shift/win 组合）
# encoder_rotate_cw_key = "down"
# encoder_rotate_ccw_key = "up"
# 旋转快慢分档：窗口格速 = steps * 100（格/秒，固件 10ms 窗口计数），>= 阈值走快速档按键。
# encoder_rotate_fast_threshold = 400
# encoder_rotate_cw_fast_key = "pagedown"
# encoder_rotate_ccw_fast_key = "pageup"
# 编码器录音灯颜色：red/green/blue/yellow/purple/cyan/white/off（off=录音也不亮）。
# 保存设置时经 BLE 下发固件并 NVS 持久化。
# encoder_led_color = "red"
# 编码器单击动作：recording（同主键录音语义）或 key（注入 encoder_press_key）。
# 配 key 时桌面端会下发门控关闭固件侧录音（长按旋钮只发按键事件）。
# encoder_press_action = "recording"
# encoder_press_key = ""
# 编码器双击动作：key（注入 encoder_double_click_key）或 recording（双击开始/停止录音）。
# encoder_double_click_action = "key"
# encoder_double_click_key = "enter"

[output]
target = "focused_app"
transform = "original"
translation_target = "en"

# Optional per-device output overrides:
# [device.C3D8.output]
# transform = "translate"
# translation_target = "en"
#
# [device."09AF".output]
# transform = "translate"
# translation_target = "zh-Hans"
