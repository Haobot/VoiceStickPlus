name: Release Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v0.1.0. Must match VERSION."
        required: true

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 国内 COS 分发面（Doc/Rfc/tencent-cos-domestic-distribution-2026-09-09.md）。
# 凭据在仓库 Secrets：TENCENT_COS_SECRET_ID / TENCENT_COS_SECRET_KEY（未配置时 COS 上传步骤失败，不静默）。
env:
  VOICESTICK_COS_BUCKET: "voicestick-dl-1259040144"
  VOICESTICK_COS_REGION: "ap-shanghai"
  VOICESTICK_DIST_DOMAIN: "https://dl.davenger.cloud"

jobs:
  build-firmware:
    name: Build StickS3 Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve tag and validate VERSION
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              tag="${{ inputs.tag }}"
          else
              tag="${GITHUB_REF_NAME}"
          fi
          version="$(cat VERSION | head -n1 | tr -d '[:space:]')"
          if [ "v${version}" != "${tag}" ]; then
              echo "::error ::tag ${tag} does not match VERSION (${version})."
              exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build firmware and merged image
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: firmware
          command: |
            idf.py build
            mkdir -p ../dist
            cp build/voice_stick.bin "../dist/voicestick-firmware-sticks3-ota-${{ steps.ver.outputs.version }}.bin"
            cd build
            esptool.py --chip esp32s3 merge_bin -o "../../dist/voicestick-firmware-sticks3-merged-${{ steps.ver.outputs.version }}.bin" @flash_args

      - name: Stage firmware checksums and manifest
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" dist
          version="${{ steps.ver.outputs.version }}"
          tag="${{ steps.ver.outputs.tag }}"
          min_version="$(cat FIRMWARE_MIN_VERSION | head -n1 | tr -d '[:space:]')"
          download_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          ota="voicestick-firmware-sticks3-ota-${version}.bin"
          merged="voicestick-firmware-sticks3-merged-${version}.bin"
          cd dist
          shasum -a 256 "${ota}" > "${ota}.sha256"
          shasum -a 256 "${merged}" > "${merged}.sha256"
          ota_sha="$(awk '{print $1}' "${ota}.sha256")"
          merged_sha="$(awk '{print $1}' "${merged}.sha256")"
          ota_size="$(wc -c < "${ota}" | tr -d ' ')"
          merged_size="$(wc -c < "${merged}" | tr -d ' ')"
          python3 - <<PY
          import json, os
          dist_domain = os.environ["VOICESTICK_DIST_DOMAIN"].rstrip("/")
          download_base = "${download_base}"
          tag = "${tag}"
          version = "${version}"
          ota = "${ota}"
          merged = "${merged}"
          # 主 URL 指向国内 COS；*_fallback 保留 GitHub Release 直链供客户端回退
          manifest = {
              "hardware": "stick_s3",
              "version": version,
              "min_version": "${min_version}",
              "ota_url": f"{dist_domain}/firmware/{tag}/{ota}",
              "ota_url_fallback": f"{download_base}/{ota}",
              "ota_sha256": "${ota_sha}",
              "ota_size": int("${ota_size}"),
              "merged_url": f"{dist_domain}/firmware/{tag}/{merged}",
              "merged_url_fallback": f"{download_base}/{merged}",
              "merged_sha256": "${merged_sha}",
              "merged_size": int("${merged_size}"),
          }
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicestick-firmware-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Upload firmware to COS
        run: |
          set -euo pipefail
          pip install cos-python-sdk-v5
          version="${{ steps.ver.outputs.version }}"
          tag="${{ steps.ver.outputs.tag }}"
          python scripts/upload_cos.py \
            --bucket "${VOICESTICK_COS_BUCKET}" \
            --region "${VOICESTICK_COS_REGION}" \
            --upload "dist/voicestick-firmware-sticks3-ota-${version}.bin" "firmware/${tag}/voicestick-firmware-sticks3-ota-${version}.bin" \
            --upload "dist/voicestick-firmware-sticks3-ota-${version}.bin.sha256" "firmware/${tag}/voicestick-firmware-sticks3-ota-${version}.bin.sha256" \
            --upload "dist/voicestick-firmware-sticks3-merged-${version}.bin" "firmware/${tag}/voicestick-firmware-sticks3-merged-${version}.bin" \
            --upload "dist/voicestick-firmware-sticks3-merged-${version}.bin.sha256" "firmware/${tag}/voicestick-firmware-sticks3-merged-${version}.bin.sha256" \
            --upload "dist/manifest.json" "firmware/${tag}/manifest.json" \
            --upload "dist/manifest.json" "firmware/latest/manifest.json"
        env:
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-firmware]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              tag="${{ inputs.tag }}"
          else
              tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: voicestick-*
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: VoiceStick ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/voicestick-firmware-sticks3-ota-${{ steps.ver.outputs.version }}.bin
            dist/voicestick-firmware-sticks3-ota-${{ steps.ver.outputs.version }}.bin.sha256
            dist/voicestick-firmware-sticks3-merged-${{ steps.ver.outputs.version }}.bin
            dist/voicestick-firmware-sticks3-merged-${{ steps.ver.outputs.version }}.bin.sha256
            dist/manifest.json

  request-website-deploy:
    name: Request Website Deploy
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website deploy on main
        run: |
          set -euo pipefail
          gh workflow run deploy-website.yml --repo ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
