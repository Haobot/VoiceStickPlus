# 临时 config：让 idf_cli.py 编译 whisper_pen_firmware 而非 firmware。
# project_dir 相对本文件目录解析，"." 指向 whisper_pen_firmware 自身。
default:
  idf_path: ""
  idf_tools_path: ""
  project_dir: "."
  target: "esp32s3"
  port: ""
  baudrate: 921600
  monitor_baudrate: 115200
  flash_baud_before_monitor: true

serial_detection:
  enabled: false

logging:
  file: "idf_cli.log"
  level: "INFO"
